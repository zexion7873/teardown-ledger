name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Claude Code, pinned
        # Bump together with the README's requirements line.
        run: npm install -g @anthropic-ai/claude-code@2.1.325 && claude --version
      - name: validate the marketplace
        run: claude plugin validate .
      - name: validate the plugin
        # validate . stops at the marketplace manifest; it does not descend into plugin/.
        run: claude plugin validate --strict plugin
      - name: test
        run: claude plugin test plugin
