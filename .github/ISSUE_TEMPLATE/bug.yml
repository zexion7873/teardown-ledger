name: Bug report
description: The count or the pane is wrong, an entry settled while the thing was still there, or a check did not settle it
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A spawn the ledger never recorded is usually not a bug: matching leans
        towards missing one, and the README's Limits list what is left out on
        purpose. An entry that settled while its process, session or folder was
        still there always is one.

  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: What `claude --version` prints.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where you saw it
      options:
        - Terminal
        - Desktop app, Code tab
        - Both
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The command, and what it printed
      description: The exact Bash command the session ran and its output, with secrets removed. The mod matches on this text, so a paraphrase cannot be diagnosed.
      render: shell
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
      description: What the count and the pane showed before and after the command. A screenshot of the pane helps most.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to make it happen again
      description: If you cannot reproduce it, say so. An intermittent report with real timestamps beats a confident guess.
      placeholder: |
        1. In a session with the mod loaded, have Claude run `python3 -m http.server 8123 &`
        2. The count shows `🧹 Teardown 1`
        3. Have Claude run `lsof -i :8123 | head -1` while the server is still up
        4. The entry is gone

  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I saw this happen myself, in a session with the mod loaded.
          required: true
